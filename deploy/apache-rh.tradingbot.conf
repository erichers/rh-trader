# rh.tradingbot — MAMP/Apache snippet
# Serves the built React SPA at http://localhost:8888/rh.tradingbot/ and
# reverse-proxies /api + /ws to the Node backend (Fastify on :8011).
#
# Apply: append to /Applications/MAMP/conf/apache/httpd.conf and restart Apache.
# Requires mod_proxy, mod_proxy_http, mod_proxy_wstunnel (loaded by MAMP default).
# Backend (:8011) and MAMP MySQL (:8889) must be running — use ./scripts/run-web.sh.

# === rh.tradingbot — BEGIN (managed) ===
ProxyPreserveHost On
ProxyTimeout 300
# Proxy API + WS first so they win over the static Alias below.
ProxyPass        /rh.tradingbot/api  http://127.0.0.1:8011/api connectiontimeout=5 timeout=300
ProxyPassReverse /rh.tradingbot/api  http://127.0.0.1:8011/api
ProxyPass        /rh.tradingbot/ws   ws://127.0.0.1:8011/ws
ProxyPassReverse /rh.tradingbot/ws   ws://127.0.0.1:8011/ws

# Serve the production build; SPA (HashRouter) falls back to index.html.
Alias /rh.tradingbot /path/to/rh-trader/frontend/dist
<Directory "/path/to/rh-trader/frontend/dist">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /rh.tradingbot/index.html
</Directory>
# === rh.tradingbot — END (managed) ===
