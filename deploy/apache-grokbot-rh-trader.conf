# rh-trader — MAMP/Apache snippet (Mac desk under grokbot)
# Canonical UI: http://localhost:8888/grokbot/rh-trader/
# Compat UI:    http://localhost:8888/rh.tradingbot/
# Reverse-proxies /api + /ws to the Node backend (Fastify on :8011).
#
# Apply with ./scripts/install-mac-grokbot.sh (rewrites the managed block).
# Requires mod_proxy, mod_proxy_http, mod_proxy_wstunnel (loaded by MAMP default).
# Backend (:8011) and MAMP MySQL (:8889) must be running — use ./scripts/desk-up.sh.

# === rh-trader grokbot — BEGIN (managed) ===
ProxyPreserveHost On
ProxyTimeout 300

# Canonical path under /Users/eric/Sites/grokbot
ProxyPass        /grokbot/rh-trader/api  http://127.0.0.1:8011/api connectiontimeout=5 timeout=300
ProxyPassReverse /grokbot/rh-trader/api  http://127.0.0.1:8011/api
ProxyPass        /grokbot/rh-trader/ws   ws://127.0.0.1:8011/ws
ProxyPassReverse /grokbot/rh-trader/ws   ws://127.0.0.1:8011/ws
Alias /grokbot/rh-trader /Users/eric/Sites/grokbot/rh-trader/frontend/dist
<Directory "/Users/eric/Sites/grokbot/rh-trader/frontend/dist">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /grokbot/rh-trader/index.html
</Directory>

# Compat: old MAMP bookmark
ProxyPass        /rh.tradingbot/api  http://127.0.0.1:8011/api connectiontimeout=5 timeout=300
ProxyPassReverse /rh.tradingbot/api  http://127.0.0.1:8011/api
ProxyPass        /rh.tradingbot/ws   ws://127.0.0.1:8011/ws
ProxyPassReverse /rh.tradingbot/ws   ws://127.0.0.1:8011/ws
Alias /rh.tradingbot /Users/eric/Sites/grokbot/rh-trader/frontend/dist
<Directory "/Users/eric/Sites/grokbot/rh-trader/frontend/dist">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /rh.tradingbot/index.html
</Directory>
# === rh-trader grokbot — END (managed) ===
